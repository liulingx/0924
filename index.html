html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050919;color:var(--ink);
-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;left:0;top:0;right:0;bottom:0;
font-family:Door924,"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;font-weight:300}
#sky{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;display:block;z-index:0}
#door{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:5;
display:flex;flex-direction:column;align-items:center;text-align:center;
padding:calc(env(safe-area-inset-top,0px) + clamp(52px,14.5vh,150px)) 28px calc(env(safe-area-inset-bottom,0px) + 20px);
transition:opacity 1s ease,transform .32s ease;will-change:opacity}
#door:before{content:"";position:absolute;left:50%;top:6%;width:min(150vw,920px);height:58%;transform:translateX(-50%);pointer-events:none;
background:radial-gradient(closest-side,rgba(4,7,22,.5),rgba(4,7,22,.3) 55%,rgba(4,7,22,0));z-index:-1}
#door.gone{opacity:0;pointer-events:none}
.c{display:inline-block}
#small{margin:0;font-size:clamp(13px,3.6vw,15px);letter-spacing:.62em;margin-right:-.62em;color:var(--soft);
text-shadow:0 0 14px rgba(6,10,30,.9)}
#big{margin:clamp(12px,2.2vh,22px) 0 0;font-size:clamp(46px,15.4vw,76px);font-weight:300;line-height:1.16;
letter-spacing:.16em;margin-right:-.16em;color:#fbf6ea;
text-shadow:0 0 34px rgba(190,206,255,.3),0 0 3px rgba(255,250,235,.3),0 2px 22px rgba(6,10,30,.72)}
#gate{width:100%;max-width:340px;margin-top:clamp(26px,5.6vh,58px);display:flex;flex-direction:column;align-items:center;
transition:opacity .7s ease,transform .7s ease}
#q{margin:0;font-size:clamp(15px,4.4vw,18px);line-height:1.75;letter-spacing:.05em;color:var(--ink);
text-shadow:0 0 16px rgba(6,10,30,.95)}
#field{position:relative;width:188px;margin-top:clamp(12px,2.2vh,22px)}
#code{display:block;width:100%;height:52px;border:0;border-radius:0;outline:0;background:transparent;
font:inherit;font-size:22px;letter-spacing:.3em;text-indent:.3em;text-align:center;color:#fff8e8;caret-color:var(--warm);
-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;
text-shadow:0 0 14px rgba(255,226,180,.4)}
#code::placeholder{color:rgba(243,237,223,.44);letter-spacing:.3em;font-size:17px}
#field:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;
background:linear-gradient(90deg,transparent,var(--line) 16%,var(--line) 84%,transparent);transition:background .4s ease,box-shadow .4s ease}
#field.on:after{background:linear-gradient(90deg,transparent,var(--warm) 14%,var(--warm) 86%,transparent);
box-shadow:0 0 12px rgba(255,220,170,.5)}
#go{margin-top:clamp(14px,2.4vh,24px);width:152px;height:50px;padding:0;border:1px solid var(--line);border-radius:2px;
background:rgba(14,20,52,.3);color:var(--ink);font:inherit;font-size:17px;letter-spacing:.42em;text-indent:.42em;cursor:pointer;
-webkit-appearance:none;appearance:none;transition:background .3s ease,border-color .3s ease,opacity .3s ease,box-shadow .3s ease}
#go:hover{border-color:rgba(255,220,170,.66)}
#go:active{background:rgba(255,226,180,.14);box-shadow:0 0 18px rgba(255,220,170,.22)}
#go[disabled]{opacity:.5}
#msg{margin:clamp(12px,1.9vh,18px) 0 0;min-height:3.5em;font-size:clamp(14px,3.9vw,16px);line-height:1.75;letter-spacing:.04em;
color:#ffe6c4;text-shadow:0 0 14px rgba(6,10,30,.96);opacity:0;transition:opacity .5s ease}
#msg.show{opacity:1}
#msg.ok{color:var(--warm);font-size:clamp(17px,4.8vw,19px);letter-spacing:.1em}
#foot{position:relative;margin:auto 0 0;font-size:clamp(12px,3.3vw,14px);letter-spacing:.2em;margin-right:-.2em;color:rgba(243,237,223,.82);
text-shadow:0 0 8px rgba(3,5,18,1),0 0 18px rgba(3,5,18,.95)}
#door:after{content:"";position:absolute;left:0;right:0;bottom:0;height:17%;pointer-events:none;z-index:-1;
background:linear-gradient(transparent,rgba(4,6,20,.62))}
.rise{opacity:0;animation:rise 1.6s ease forwards}
.d1{animation-delay:.5s}.d2{animation-delay:.8s}.d3{animation-delay:1.3s}.d4{animation-delay:1.9s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:shake .46s ease}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:none}}
body.open #gate{opacity:0;transform:translateY(-6px);pointer-events:none}
body.open #msg{opacity:1}
body.kb #foot{opacity:0}
@media (max-height:600px){
#door{padding-top:calc(env(safe-area-inset-top,0px) + 34px)}
#big{font-size:clamp(40px,12vw,54px)}
#msg{min-height:3.5em}
}
@media (max-height:440px){
#door{padding-top:14px}
#small{display:none}
#big{margin-top:0;font-size:34px}
#gate{margin-top:8px;max-width:520px;display:grid;grid-template-columns:1fr 1fr;grid-gap:2px 18px;align-items:center}
#q{grid-column:1/3}
#field{margin-top:0;justify-self:end}
#go{margin-top:0;justify-self:start}
#msg{grid-column:1/3;min-height:1.8em;margin-top:4px}
#foot{display:none}
}
@media (prefers-reduced-motion:reduce){
.rise{animation-duration:.4s;animation-delay:0s}
.shake{animation:none}
}
</style>
</head>

    </div>
    <button id="go" type="submit">对暗号</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p id="foot" class="rise d4">戴上耳机，找个没人的地方。</p>
</main>
